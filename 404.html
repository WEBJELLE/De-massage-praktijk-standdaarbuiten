<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<script>
  // Oude JouwWeb-adressen doorsturen naar de juiste plek op de nieuwe site
  (function () {
    var pad = location.pathname.toLowerCase().replace(/\/+$/, '');
    var naar = [
      [/^\/tarieven/, '/#tarieven'],
      [/^\/contact/, '/#contact'],
      [/^\/wie-ben-ik/, '/#over-mij'],
      [/^\/magnesium-1/, '/#magnesium'],
      [/^\/massages/, '/#behandelingen']
    ];
    for (var i = 0; i < naar.length; i++) {
      if (naar[i][0].test(pad)) { location.replace(naar[i][1]); return; }
    }
  })();
</script>
